[project]
name = "gatekeeper"
version = "0.1.0"
description = "Shared authentication service and library"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.0",
    "apsw>=3.45",
    "itsdangerous>=2.1",
    "gunicorn>=23.0",
    "openpyxl>=3.1",
    "httpx>=0.27",
    # python-ldap is a C extension that cannot build on Windows (no OpenLDAP
    # headers). Only the server (Linux/Docker) and local-backend lookups use it;
    # the HTTP client degrades gracefully when it is absent.
    "python-ldap>=3.4; sys_platform != 'win32'",
    "click>=8.0",
    # OIDC client. flask_client pulls in requests; the httpx integration does
    # not, but would mean hand-writing state, nonce and PKCE handling, and those
    # are not things to hand-write.
    "authlib>=1.6",
    "requests>=2.32",
]

[project.scripts]
gatekeeper-admin = "gatekeeper.cli:main"
gatekeeper-web = "gatekeeper.web:main"

[project.optional-dependencies]
dev = [
    "ruff",
    "ty",
    "pytest",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gatekeeper*"]

[tool.setuptools.package-data]
gatekeeper = ["templates/**/*.html", "static/**/*"]

[tool.ruff]
target-version = "py314"
line-length = 100
lint.select = ["E", "F", "I", "UP", "B"]
lint.ignore = ["E501"]

[tool.ty.environment]
python-version = "3.14"
